services:
  - type: web
    name: wingerx-crm
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_PORT
        value: "10000"
      - key: PG_DATABASE_URL
        fromDatabase:
          name: wingerx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: wingerx-redis
          type: keyvalue
          property: connectionString
      - key: SERVER_URL
        fromService:
          name: wingerx-crm
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_TYPE
        value: local
      - key: DISABLE_DB_MIGRATIONS
        value: "false"
      - key: DISABLE_CRON_JOBS_REGISTRATION
        value: "false"
      - key: IS_BILLING_ENABLED
        value: "false"
      - key: SIGN_IN_PREFILLED
        value: "false"
      - key: APPLICATION_LOG_DRIVER
        value: CONSOLE

  - type: worker
    name: wingerx-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    dockerCommand: node dist/queue-worker/queue-worker
    envVars:
      - key: PG_DATABASE_URL
        fromDatabase:
          name: wingerx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: wingerx-redis
          type: keyvalue
          property: connectionString
      - key: SERVER_URL
        fromService:
          name: wingerx-crm
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_SECRET
        fromService:
          name: wingerx-crm
          type: web
          envVarKey: APP_SECRET
      - key: ENCRYPTION_KEY
        fromService:
          name: wingerx-crm
          type: web
          envVarKey: ENCRYPTION_KEY
      - key: STORAGE_TYPE
        value: local
      - key: DISABLE_DB_MIGRATIONS
        value: "true"
      - key: DISABLE_CRON_JOBS_REGISTRATION
        value: "true"
      - key: IS_BILLING_ENABLED
        value: "false"
      - key: APPLICATION_LOG_DRIVER
        value: CONSOLE

  - type: keyvalue
    name: wingerx-redis
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: wingerx-db
    plan: basic-256mb
    postgresMajorVersion: "18"
