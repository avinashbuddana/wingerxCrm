# Defaults only. NEVER put secrets in this file.
# WHATOMATE_SECTION__KEY environment variables override these settings.
[app]
name = "WingerX WhatsApp CRM"
environment = "production"
debug = false

[server]
host = "0.0.0.0"
port = 8080

[storage]
type = "local"
local_path = "./uploads"

[whatsapp]
api_version = "v24.0"
base_url = "https://graph.facebook.com"

[cookie]
secure = true

[rate_limit]
enabled = true
login_max_attempts = 10
window_seconds = 60

[calling]
recording_enabled = false
