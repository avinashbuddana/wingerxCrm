# Isolated, empty client tenant for Shree Gajanand Jewellers; no existing WhatsApp or CRM data.
services:
  - type: web
    name: wingerx-gajanand-whatsapp
    runtime: docker
    plan: free
    region: singapore
    branch: client/shree-gajanand-whatsapp-crm
    dockerContext: ./apps/wingerx-whatsapp-crm
    dockerfilePath: ./apps/wingerx-whatsapp-crm/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: wingerx-gajanand-wa-db
          property: connectionString
      - key: WHATOMATE_DATABASE__USER
        fromDatabase:
          name: wingerx-gajanand-wa-db
          property: user
      - key: WHATOMATE_DATABASE__PASSWORD
        fromDatabase:
          name: wingerx-gajanand-wa-db
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wingerx-gajanand-wa-redis
          property: connectionString
      - key: WHATOMATE_APP__ENVIRONMENT
        value: production
      - key: WHATOMATE_APP__DEBUG
        value: "false"
      - key: WHATOMATE_APP__ENCRYPTION_KEY
        generateValue: true
      - key: WHATOMATE_JWT__SECRET
        generateValue: true
      - key: WHATOMATE_WHATSAPP__WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: WHATOMATE_DEFAULT_ADMIN__EMAIL
        value: admin@admin.com
      - key: WHATOMATE_DEFAULT_ADMIN__PASSWORD
        generateValue: true
      - key: WHATOMATE_RATE_LIMIT__ENABLED
        value: "true"
      - key: WHATOMATE_WHATSAPP__API_VERSION
        value: v24.0
      - key: WHATOMATE_DEFAULT_ADMIN__FULL_NAME
        value: SGJ Administrator
      - key: WHATOMATE_CALLING__RECORDING_ENABLED
        value: "false"
      - key: WHATOMATE_STORAGE__TYPE
        value: local
  - type: keyvalue
    name: wingerx-gajanand-wa-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: wingerx-gajanand-wa-db
    databaseName: wingerx_gajanand_wa
    user: wingerx_gajanand_wa_user
    region: singapore
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
